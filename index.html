<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Share tags: one preview for every page, from the Home words in 01-PRODUCT/CONTENT.md (Redesign v2 words). Social apps need full addresses.
         Replace SITE-NAME with the real Netlify site name (or the domain later) in this file, robots.txt and sitemap.xml together. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dhemmyn Food" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Dhemmyn Food: custom cakes and party small chops in London" />
    <meta
      property="og:description"
      content="Custom celebration cakes, party small chops and fresh bakes, handmade in London by Demi Yusuf. Send your order request online or on WhatsApp."
    />
    <meta property="og:url" content="https://SITE-NAME.netlify.app/" />
    <meta property="og:image" content="https://SITE-NAME.netlify.app/share.jpg" />
    <meta property="og:image:alt" content="A slice of chocolate sponge with white cream and Oreo crumbs on a white plate." />
    <meta name="twitter:card" content="summary" />
    <!-- The display font (headlines) starts downloading at once instead of after the page's code has run. Vite swaps this address for the built, hashed file. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wdth-normal.woff2"
    />
  </head>
  <body>
    <!-- Plain copies of the two enquiry forms. Netlify reads them when the site is deployed.
         The field names must match src/data/forms.ts exactly, or Netlify drops the field. -->
    <form name="custom-cakes" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="custom-cakes" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="date" />
      <input name="occasion" />
      <input name="servings" />
      <textarea name="ideas"></textarea>
      <textarea name="allergies"></textarea>
    </form>
    <form name="catering" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="catering" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="date" />
      <input name="guests" />
      <input name="town" />
      <textarea name="food"></textarea>
      <textarea name="allergies"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
