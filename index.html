<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Share tags: one preview for every page, from the Home words in 01-PRODUCT/CONTENT.md (Redesign v2 words). Social apps need full addresses.
         The address https://dhemmynfood.mimmycare.com is also in public/robots.txt and public/sitemap.xml: change all three together. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dhemmyn Food" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Dhemmyn Food: custom cakes and party small chops in London" />
    <meta
      property="og:description"
      content="Custom celebration cakes, party small chops and fresh bakes, handmade in London by Demi Yusuf. Send your order request online or on WhatsApp."
    />
    <meta property="og:url" content="https://dhemmynfood.mimmycare.com/" />
    <meta property="og:image" content="https://dhemmynfood.mimmycare.com/share.jpg" />
    <meta property="og:image:alt" content="A slice of chocolate sponge with white cream and Oreo crumbs on a white plate." />
    <meta name="twitter:card" content="summary" />
    <!-- The display font (headlines) starts downloading at once instead of after the page's code has run. Vite swaps this address for the built, hashed file. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wdth-normal.woff2"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
