project:
  name: "dhemmyn-food"
  product: "Dhemmyn Food"
  stack: "React, TypeScript, Tailwind, Vite"
  type: "website"
  lifecycle: "build"
  risk: "medium"

defaults:
  mode: "existing-application"
  workflows:
    - "change-safety"
  specialists: []

exclusions:
  - "invented business facts: privacy notice content and contact details need owner input (site address set to dhemmynfood.mimmycare.com, 30 Oct 2026)"
  - "credentials, secret copying, or switching on live form delivery (private config on the server, owner only)"
  - "deployment, server writes, production mutation or external messages without the owner"

sources_of_truth:
  - "docs/01-product/PRODUCT-SPEC.md"
  - "docs/01-product/CONTENT.md"
  - "docs/01-product/BUSINESS-RULES.md"
  - "docs/02-architecture/ARCHITECTURE.md"
  - "docs/03-design/DESIGN-SYSTEM.md"
  - "docs/03-design/ACCESSIBILITY.md"
  - "docs/08-change-management/DECISIONS.md"

mcp_profile: "none"
